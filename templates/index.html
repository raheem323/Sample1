<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Checker</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>BMI Checker</h1>
            <p class="subtitle">Enter your details to calculate your Body Mass Index.</p>

            <form method="POST">
                <label for="weight">Weight (kg)</label>
                <input type="number" id="weight" name="weight" step="0.1" min="0" placeholder="e.g. 65" required>

                <label for="height">Height (cm)</label>
                <input type="number" id="height" name="height" step="0.1" min="0" placeholder="e.g. 170" required>

                <button type="submit">Calculate BMI</button>
            </form>

            {% if error %}
                <div class="result error">{{ error }}</div>
            {% endif %}

            {% if bmi is not none %}
                <div class="result">
                    <h2>Your BMI: {{ bmi }}</h2>
                    <p>Category: <strong>{{ category }}</strong></p>
                </div>
            {% endif %}
        </div>
    </div>
</body>
</html>
